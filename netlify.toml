# Netlify build settings (read automatically when the repo is connected).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+; pin it so an old default can't break the build.
  NODE_VERSION = "22"

# Keep the page out of search engines (on top of the <meta name="robots"> tag).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Built JS/CSS have hashed names, so they can be cached for a long time.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
